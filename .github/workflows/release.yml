name: Release

# Push a tag like v0.1.0 to build both apps and publish a GitHub release with the downloads.
# "Run workflow" (workflow_dispatch) does the same builds without publishing anything: a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build, self-test, package (DMG + zip)
        working-directory: macos
        run: |
          swift build
          .build/debug/AgyUsageBar --selftest
          ./make_dmg.sh ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/tests/AgyUsageBar.Tests --configuration Release
      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/AgyUsageBar --configuration Release --runtime ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true --output publish/${{ matrix.rid }}
      - name: Build the MSI
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') { $tag = 'v0.0.0' }   # dry run from a branch
          $version = ($tag -replace '^v', '') -replace '[^0-9.].*$', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag $tag must look like v1.2.3 (the MSI needs a numeric version)" }
          $arch = "${{ matrix.rid }}".Replace('win-', '')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/${{ matrix.rid }}/AgyUsageBar.exe dist/AgyUsageBar-${{ matrix.rid }}.exe
          ./windows/installer/build-msi.ps1 -Exe publish/${{ matrix.rid }}/AgyUsageBar.exe -Arch $arch -Version $version -Out dist/AgyUsageBar-${{ matrix.rid }}.msi
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: dist/

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          rm -f *.wixpdb
          ls -la
          sha256sum AgyUsageBar-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        continue-on-error: true   # nice to have: lets anyone check the files were built by this workflow
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/AgyUsageBar-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Downloads

          | | File | Notes |
          |---|---|---|
          | macOS 13+ | `AgyUsageBar-macos.dmg` | Open it and drag **AgyUsageBar** to *Applications*. The app is not notarized, so on first launch macOS asks for confirmation: *System Settings -> Privacy & Security -> Open Anyway*. |
          | Windows 10/11 | `AgyUsageBar-win-x64.msi` (Intel/AMD) or `AgyUsageBar-win-arm64.msi` | Double-click. Per-user install, no administrator rights. SmartScreen may ask: *More info -> Run anyway*. |
          | Windows, portable | `AgyUsageBar-win-x64.exe` / `-arm64.exe` | Single file, just run it. |
          | macOS, scripted | `AgyUsageBar-macos.zip` | Used by `scripts/install.sh`. |

          Needs the Antigravity CLI (`agy`) installed and signed in. The Windows app is beta.

          The files are built from this repository by GitHub Actions. Check one with `shasum -a 256 <file>` against `SHA256SUMS.txt`, or `gh attestation verify <file> --repo AxelanO7/agy-usage-bar`.

          NOTES
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file notes.md --generate-notes
