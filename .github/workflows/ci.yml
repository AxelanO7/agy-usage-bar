name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and self-test
        working-directory: macos
        run: |
          swift build
          .build/debug/AgyUsageBar --selftest
      - name: Package the app, DMG and zip (universal, ad-hoc signed)
        working-directory: macos
        run: ./make_dmg.sh ../dist
      - name: Check the DMG contents
        run: |
          hdiutil attach dist/AgyUsageBar-macos.dmg -nobrowse -mountpoint /tmp/agy-dmg
          ls -la /tmp/agy-dmg
          test -d /tmp/agy-dmg/AgyUsageBar.app
          test -L /tmp/agy-dmg/Applications
          codesign -v /tmp/agy-dmg/AgyUsageBar.app
          lipo -archs /tmp/agy-dmg/AgyUsageBar.app/Contents/MacOS/AgyUsageBar
          hdiutil detach /tmp/agy-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/
      - name: Render screenshots from demo data
        working-directory: macos
        continue-on-error: true   # needs a window server; nice to have, not a gate
        run: |
          mkdir -p ../out
          .build/debug/AgyUsageBar --snapshot ../out/macos-dark.png --demo --dark --lang en
          .build/debug/AgyUsageBar --snapshot ../out/macos-light.png --demo --lang en
          .build/debug/AgyUsageBar --snapshot ../out/macos-id.png --demo --dark --lang id --pool 3p
          .build/debug/AgyUsageBar --menubar-preview ../out/macos-menubar.png --lang en
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: out/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/tests/AgyUsageBar.Tests --configuration Release
      - name: Build the tray app
        run: dotnet build windows/src/AgyUsageBar --configuration Release
      - name: Render screenshots from demo data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Resolve-Path windows/src/AgyUsageBar/bin/Release/net10.0-windows/AgyUsageBar.exe
          function Run($argList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "AgyUsageBar $argList exited with $($p.ExitCode)" }
          }
          Run @('--snapshot', 'out/windows-dark.png', '--dark', '--lang', 'en')
          Run @('--snapshot', 'out/windows-light.png', '--lang', 'en')
          Run @('--snapshot', 'out/windows-id.png', '--dark', '--lang', 'id', '--pool', '3p')
          Run @('--icons', 'out/windows-tray-icons.png')
          Get-ChildItem out
      - name: Smoke test the tray app with a fake agy
        shell: pwsh
        run: |
          # A stand-in agy.cmd that prints the fixture, so the real code path (find agy, run it, parse, persist) runs end to end.
          $fake = Join-Path $PWD 'fake-agy'
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          Copy-Item windows/tests/fixtures/usage.json (Join-Path $fake 'usage.json')
          Set-Content -Path (Join-Path $fake 'agy.cmd') -Value '@type "%~dp0usage.json"' -Encoding ASCII
          $env:PATH = "$fake;$env:PATH"
          $exe = Resolve-Path windows/src/AgyUsageBar/bin/Release/net10.0-windows/AgyUsageBar.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          $file = Join-Path $env:LOCALAPPDATA 'AgyUsageBar\last-usage.json'
          if (-not (Test-Path $file)) { throw "No last-usage.json: the app did not fetch from agy" }
          $json = Get-Content $file -Raw
          if ($json -notmatch 'gemini-5h') { throw "last-usage.json has no gemini-5h bucket: $json" }
          Write-Host "OK: the app ran, called agy and stored $((Get-Item $file).Length) bytes"
          Stop-Process -Id $p.Id -Force
      - name: Publish the single-file exe (x64)
        run: >
          dotnet publish windows/src/AgyUsageBar --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64
      - name: Build the MSI (and a newer one to test upgrades)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, upgrade | Out-Null
          Copy-Item publish/win-x64/AgyUsageBar.exe dist/AgyUsageBar-win-x64.exe
          ./windows/installer/build-msi.ps1 -Exe publish/win-x64/AgyUsageBar.exe -Arch x64 -Version 0.1.0 -Out dist/AgyUsageBar-win-x64.msi
          ./windows/installer/build-msi.ps1 -Exe publish/win-x64/AgyUsageBar.exe -Arch x64 -Version 0.1.1 -Out upgrade/AgyUsageBar-win-x64-0.1.1.msi
          Get-ChildItem dist, upgrade
      - name: Install, upgrade and uninstall the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v1 = (Resolve-Path dist/AgyUsageBar-win-x64.msi).Path
          $v2 = (Resolve-Path upgrade/AgyUsageBar-win-x64-0.1.1.msi).Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AgyUsageBar'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Agy Usage Bar.lnk'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $arpRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'

          # msiexec is started and awaited by hand: "Start-Process -Wait" also waits for the tray app that the installer launches, and would never return.
          function Invoke-Msi([string]$Verb, [string]$Msi, [string]$Log, [string]$Extra = '') {
            $psi = New-Object System.Diagnostics.ProcessStartInfo 'msiexec.exe'
            $psi.UseShellExecute = $false
            $psi.Arguments = ('/{0} "{1}" /qn /norestart /l*v "{2}" {3}' -f $Verb, $Msi, $Log, $Extra)
            $p = [System.Diagnostics.Process]::Start($psi)
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "msiexec /$Verb timed out" }
            if ($p.ExitCode -ne 0) { if (Test-Path $Log) { Get-Content $Log -Tail 150 }; throw "msiexec /$Verb exited with $($p.ExitCode)" }
          }
          function Wait-Until([scriptblock]$Condition, [int]$Seconds = 20) {
            for ($i = 0; $i -lt $Seconds; $i++) { if (& $Condition) { return $true }; Start-Sleep -Seconds 1 }
            return [bool](& $Condition)
          }
          function Get-Arp { Get-ChildItem $arpRoot -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq 'Agy Usage Bar' } }
          function Get-AppCount { @(Get-Process AgyUsageBar -ErrorAction SilentlyContinue).Count }

          # 1. Fresh install: files, shortcut, app started, registered, launch at login off.
          Invoke-Msi i $v1 install.log
          if (-not (Test-Path "$dir\AgyUsageBar.exe")) { throw 'AgyUsageBar.exe was not installed' }
          if (-not (Test-Path $lnk)) { throw 'Start Menu shortcut is missing' }
          if (-not (Wait-Until { (Get-AppCount) -eq 1 })) { throw "Expected the installer to start the app once, running copies: $(Get-AppCount)" }
          $arp = @(Get-Arp)
          if ($arp.Count -ne 1 -or $arp[0].DisplayVersion -ne '0.1.0') { throw "Add/Remove Programs entry missing or wrong: $($arp | Out-String)" }
          if (Get-ItemProperty $run -Name AgyUsageBar -ErrorAction SilentlyContinue) { throw 'Launch at login must be off by default' }
          Write-Host 'Fresh install OK'

          # 2. Upgrade while the app is running: one copy afterwards, new version registered, no leftovers of the old entry.
          Invoke-Msi i $v2 upgrade.log
          if (-not (Wait-Until { (Get-AppCount) -eq 1 })) { throw "After the upgrade expected 1 running copy, found $(Get-AppCount)" }
          $arp = @(Get-Arp)
          if ($arp.Count -ne 1 -or $arp[0].DisplayVersion -ne '0.1.1') { throw "Upgrade did not replace the old entry: $($arp | Out-String)" }
          if (-not (Test-Path "$dir\AgyUsageBar.exe")) { throw 'The exe vanished during the upgrade' }
          Write-Host 'Upgrade OK'

          # 3. Uninstall removes everything and stops the app.
          Invoke-Msi x $v2 uninstall.log
          if (-not (Wait-Until { (Get-AppCount) -eq 0 })) { throw 'The app is still running after uninstall' }
          if (Test-Path $dir) { throw 'The install folder is still there after uninstall' }
          if (Test-Path $lnk) { throw 'The shortcut is still there after uninstall' }
          if (@(Get-Arp).Count -ne 0) { throw 'The Add/Remove Programs entry is still there after uninstall' }
          Write-Host 'Uninstall OK'

          # 4. The optional switch: LAUNCHATLOGIN=1 writes the Run key, uninstall removes it.
          Invoke-Msi i $v1 install-login.log 'LAUNCHATLOGIN=1'
          $val = (Get-ItemProperty $run -Name AgyUsageBar -ErrorAction SilentlyContinue).AgyUsageBar
          if ($val -notlike '*AgyUsageBar.exe*') { throw "LAUNCHATLOGIN=1 did not write the Run key: '$val'" }
          Invoke-Msi x $v1 uninstall-login.log
          if (Get-ItemProperty $run -Name AgyUsageBar -ErrorAction SilentlyContinue) { throw 'The Run key is still there after uninstall' }
          if (-not (Wait-Until { (Get-AppCount) -eq 0 })) { throw 'The app is still running after the last uninstall' }
          Write-Host 'Launch-at-login switch OK'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msi-logs
          path: "*.log"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: out/
          if-no-files-found: ignore
